name: Android Mapper

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      signed_release:
        description: ساخت فایل نصب با کلید ثابت مالک؛ بدون انتشار عمومی
        type: boolean
        default: false
        required: false

permissions:
  contents: read

concurrency:
  group: mapper-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Install pinned Android platform and tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
      - name: Test, lint and build
        run: |
          python3 -B -m unittest discover -s tools -p 'test_*.py' -v
          ./gradlew :core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon --console=plain
          python3 -B tools/verify_scanner_runtime.py app/build/outputs/apk/debug/app-debug.apk
      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: btc-tag-mapper-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mapper-reports-${{ github.sha }}
          path: |
            core/build/reports/
            core/build/test-results/
            app/build/reports/
            app/build/test-results/
          retention-days: 7
          if-no-files-found: warn

  signed:
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.signed_release) || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    needs: test
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate trusted source and version before secrets
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          RELEASE_TAG=$(python3 -B tools/release_guard.py)
          printf 'RELEASE_TAG=%s\n' "$RELEASE_TAG" >> "$GITHUB_ENV"
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
      - name: Install pinned Android platform and tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
      - name: Restore key, build and verify signed APK
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          export ANDROID_RELEASE_KEYSTORE="$RUNNER_TEMP/mapper-release.jks"
          trap 'rm -f "$ANDROID_RELEASE_KEYSTORE"' EXIT
          for name in ANDROID_RELEASE_KEYSTORE_BASE64 ANDROID_RELEASE_STORE_PASSWORD ANDROID_RELEASE_KEY_ALIAS ANDROID_RELEASE_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              printf '::error::Required signing secret is missing: %s\n' "$name"
              exit 1
            fi
          done
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_RELEASE_KEYSTORE"
          test -s "$ANDROID_RELEASE_KEYSTORE"
          ./gradlew :app:assembleRelease --no-daemon --console=plain
          APK=app/build/outputs/apk/release/app-release.apk
          python3 -B tools/verify_scanner_runtime.py "$APK"
          mkdir -p dist
          python3 -B tools/verify_release_apk.py "$APK" > dist/signing-certificate.txt
          cp "$APK" dist/btc-tag-mapper.apk
          (cd dist && sha256sum btc-tag-mapper.apk signing-certificate.txt > SHA256SUMS)
      - name: Remove runner key on every outcome
        if: always()
        run: rm -f "$RUNNER_TEMP/mapper-release.jks"
      - name: Upload signed APK and verification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: btc-tag-mapper-signed-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Publish verified public release for version tag only
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            dist/btc-tag-mapper.apk dist/SHA256SUMS dist/signing-certificate.txt \
            --verify-tag --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --notes-file "docs/releases/${RELEASE_TAG}.fa.md" \
            --draft=false --prerelease=false --latest
          gh release view "$RELEASE_TAG" --json tagName,isDraft,isPrerelease,assets > "$RUNNER_TEMP/mapper-release.json"
          python3 - "$RUNNER_TEMP/mapper-release.json" <<'PY'
          import json, os, pathlib
          release = json.loads(pathlib.Path(os.sys.argv[1]).read_text())
          expected = {'btc-tag-mapper.apk', 'SHA256SUMS', 'signing-certificate.txt'}
          assert release['tagName'] == os.environ['RELEASE_TAG']
          assert release['isDraft'] is False and release['isPrerelease'] is False
          assert len(release['assets']) == len(expected)
          assert {asset['name'] for asset in release['assets']} == expected
          assert all(asset['size'] > 0 for asset in release['assets'])
          PY
          DOWNLOAD_DIR=$(mktemp -d "$RUNNER_TEMP/mapper-download.XXXXXX")
          trap 'rm -rf "$DOWNLOAD_DIR"' EXIT
          gh release download "$RELEASE_TAG" --dir "$DOWNLOAD_DIR" \
            --pattern btc-tag-mapper.apk --pattern SHA256SUMS --pattern signing-certificate.txt
          cmp dist/SHA256SUMS "$DOWNLOAD_DIR/SHA256SUMS"
          (cd "$DOWNLOAD_DIR" && sha256sum --check SHA256SUMS)
          python3 -B tools/verify_release_apk.py "$DOWNLOAD_DIR/btc-tag-mapper.apk"
          python3 -B tools/verify_scanner_runtime.py "$DOWNLOAD_DIR/btc-tag-mapper.apk"
